<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ikky Rmx</title>
  <style>
    /* RESET & DASAR */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #121212 url('BG.jpg') no-repeat center center fixed;
      background-size: cover;
      color: white;
      min-height: 100vh;
    }

    /* HEADER */
    header {
      padding: 12px 20px;
      background: linear-gradient(90deg, #6a00ff, #00bfff);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 1000;
    }

    .header-content {
      display: flex;
      align-items: center;
      gap: 15px;
      max-width: 900px;
      margin: auto;
    }

    .header-content img {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #ffffff;
      flex-shrink: 0; /* Mencegah gambar tertekan di layar kecil */
    }

    .header-text h1 {
      font-size: 22px;
      font-weight: bold;
    }

    .header-text p {
      opacity: 0.85;
      font-size: 13px;
    }

    /* HALAMAN */
    .page {
      display: none;
      padding-top: 90px;
      padding-bottom: 90px;
    }

    .page.active {
      display: block;
    }

    /* DASHBOARD CARD */
    .dashboard-card {
      max-width: 320px;
      margin: 40px auto;
      background: rgba(24, 24, 24, 0.9);
      padding: 25px;
      border-radius: 30px;
      text-align: center;
      box-shadow: 0 0 20px rgba(0, 170, 255, 0.35);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .dashboard-card h2 {
      font-size: 18px;
      margin-bottom: 10px;
    }

    .dashboard-card p {
      font-size: 13px;
      color: #ccc;
      line-height: 1.4;
      margin-bottom: 20px;
    }

    .dash-btn {
      display: block;
      width: 100%;
      background: #00bfff;
      color: white;
      padding: 12px;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 12px;
      transition: 0.2s;
      text-decoration: none;
    }

    .dash-btn:hover {
      opacity: 0.85;
      transform: translateY(-2px);
    }

    /* CONTAINER PRODUK */
    .container {
      width: 90%;
      max-width: 900px;
      margin: auto;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }

    /* CARD PRODUK */
    .card {
      background: rgba(24, 24, 24, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      overflow: hidden;
      transition: 0.3s;
      box-shadow: 0 0 15px rgba(0, 170, 255, 0.2);
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 0 25px #00aaff;
    }

    .card img {
      width: 80%;
      margin: 15px auto 5px;
      display: block;
      aspect-ratio: 1/1;
      object-fit: cover;
      border-radius: 12px;
    }

    .info {
      padding: 15px;
    }

    .info h2 {
      font-size: 16px;
      margin-bottom: 6px;
      color: #fff;
    }

    .price {
      font-size: 18px;
      color: #00ff88;
      margin: 6px 0;
      font-weight: bold;
    }

    .stats {
      color: #bbb;
      font-size: 12px;
      margin-bottom: 12px;
    }

    .btn-group {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-top: 10px;
    }

    button {
      padding: 10px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: bold;
      transition: 0.2s;
    }

    .play {
      background: #00bfff;
      color: white;
      width: 48%;
    }

    .buy {
      background: #00ff88;
      color: #111;
      width: 48%;
    }

    button:hover {
      opacity: 0.85;
    }

    /* PROGRESS BAR AUDIO */
    .progress-box {
      width: 80%;
      margin: 5px auto 0;
    }

    .progress-bar {
      width: 100%;
      height: 6px;
      background: #444;
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
    }

    .progress {
      width: 0%;
      height: 100%;
      background: #00bfff;
      border-radius: 10px;
    }

    .time {
      display: flex;
      justify-content: space-between;
      margin-top: 4px;
      font-size: 11px;
      color: #aaa;
    }

    /* MENU NAVIGASI BAWAH */
    .menu {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 500px;
      background: rgba(20, 20, 20, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-top: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 25px 25px 0 0;
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 10px 0;
      box-shadow: 0 0 20px rgba(0, 170, 255, 0.25);
      z-index: 1000;
    }

    .menu button {
      background: none;
      border: none;
      color: white;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      padding: 6px 16px;
      transition: color 0.2s;
    }

    .menu button.nav-active {
      color: #00bfff;
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="header-content">
      <!-- Menggunakan LOGO.jpg sesuai nama file Anda -->
      <img src="LOGO.jpg" alt="Logo Ikky Rmx">
      <div class="header-text">
        <h1 id="brandName">Ikky Rmx</h1>
        <p id="brandTag">FLM versi ZIP Jalur VIP</p>
      </div>
    </div>
  </header>

  <!-- HALAMAN DASHBOARD -->
  <div id="dashboard" class="page active">
    <div class="dashboard-card">
      <h2>Klik (🛍 Produk) Di Kanan Bawah</h2>
      <p>Jika lagu/remix yang Anda cari tidak ada di daftar produk, silakan hubungi kami via WhatsApp.</p>
      
      <button class="dash-btn" id="btnChannel">💬 Saluranku</button>
      <button class="dash-btn" id="btnWA">💬 WhatsApp</button>
      
      <hr style="border:0.5px solid #444; margin: 15px 0;">
      
      <div>
        <h3 id="totalProduk" style="font-size:16px; margin-bottom: 5px;">⭐ Total Produk : 0</h3>
        <h3 id="totalTerjual" style="font-size:16px;">🔥 Terjual : 0</h3>
      </div>
    </div>
  </div>

  <!-- HALAMAN PRODUK -->
  <div id="produk" class="page">
    <div class="container" id="produkContainer"></div>
  </div>

  <!-- MENU NAVIGASI BAWAH -->
  <div class="menu">
    <button id="navDashboard" class="nav-active">🏠<br>Dashboard</button>
    <button id="navProduk">🛍<br>Produk</button>
  </div>

  <script>
    // --- PENGATURAN TOKO ---
    const config = {
      brand: "Ikky Rmx",
      tag: "FLM versi ZIP Jalur VIP",
      waNumber: "6281234567890", // Ganti dengan nomor WA Anda (Format: 628...)
      channelUrl: "https://whatsapp.com/channel/" // Ganti dengan link saluran WA Anda
    };

    // --- DAFTAR PRODUK ---
    const produkList = [
      ["ASTAGA BERCANDA - AKBAR CHALAY", "Rp45.000", 2, "AKBAR18.mp3"],
      ["RADYA SPN - SELAIN DONATUR VIRAL", "Rp45.000", 13, "DONATUR13.mp3"],
      ["RADYA SPN - V2", "Rp45.000", 11, "RADYA V2 15.mp3"],
      ["THAILAND - AIPON KUPI", "Rp45.000", 14, "TH KUPI16.mp3"],
      ["HIPDUT - LATASYA", "Rp30.000", 10, "HIPDUT11.mp3"]
    ];

    // Inisialisasi Teks Header
    document.getElementById("brandName").textContent = config.brand;
    document.getElementById("brandTag").textContent = config.tag;

    // Aksi Tombol Dashboard
    document.getElementById("btnChannel").onclick = () => window.open(config.channelUrl, "_blank");
    document.getElementById("btnWA").onclick = () => window.open(`https://wa.me/${config.waNumber}`, "_blank");

    // Render Produk
    const container = document.getElementById("produkContainer");
    let totalTerjualCount = 0;

    produkList.forEach((item) => {
      const title = item[0];
      const price = item[1];
      const sold = item[2];
      const audioFile = item[3];
      totalTerjualCount += sold;

      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `
        <img src="LOGO.jpg" alt="Cover">
        <div class="progress-box">
          <div class="progress-bar"><div class="progress"></div></div>
          <div class="time"><span class="current">0:00</span><span class="duration">0:00</span></div>
        </div>
        <div class="info">
          <h2>${title}</h2>
          <div class="price">${price}</div>
          <div class="stats">Terjual ${sold}</div>
          <div class="btn-group">
            <button class="play">▶ Play</button>
            <button class="buy">🛒 Beli</button>
          </div>
          <audio src="${audioFile}" preload="metadata"></audio>
        </div>
      `;

      // Event Tombol Beli
      card.querySelector(".buy").onclick = () => {
        const msg = `Halo ${config.brand},\n\nSaya ingin membeli lagu/remix:\n📌 *Judul:* ${title}\n💰 *Harga:* ${price}`;
        window.open(`https://wa.me/${config.waNumber}?text=${encodeURIComponent(msg)}`, "_blank");
      };

      // Event Player Audio
      const audio = card.querySelector("audio");
      const playBtn = card.querySelector(".play");
      const progressBar = card.querySelector(".progress");
      const progressContainer = card.querySelector(".progress-bar");
      const currentTimeEl = card.querySelector(".current");
      const durationTimeEl = card.querySelector(".duration");

      const formatTime = (s) => isNaN(s) ? "0:00" : Math.floor(s / 60) + ":" + String(Math.floor(s % 60)).padStart(2, "0");

      playBtn.onclick = () => {
        if (!audio.paused) {
          audio.pause();
          playBtn.textContent = "▶ Play";
        } else {
          document.querySelectorAll("audio").forEach(a => {
            a.pause();
            const btn = a.closest(".card").querySelector(".play");
            if (btn) btn.textContent = "▶ Play";
          });
          audio.play();
          playBtn.textContent = "⏸ Pause";
        }
      };

      audio.addEventListener("loadedmetadata", () => {
        durationTimeEl.textContent = formatTime(audio.duration);
      });

      audio.addEventListener("timeupdate", () => {
        if (audio.duration) {
          progressBar.style.width = (audio.currentTime / audio.duration * 100) + "%";
          currentTimeEl.textContent = formatTime(audio.currentTime);
        }
      });

      progressContainer.addEventListener("click", (e) => {
        const rect = progressContainer.getBoundingClientRect();
        audio.currentTime = ((e.clientX - rect.left) / rect.width) * audio.duration;
      });

      audio.addEventListener("ended", () => {
        playBtn.textContent = "▶ Play";
        progressBar.style.width = "0%";
        currentTimeEl.textContent = "0:00";
      });

      container.appendChild(card);
    });

    // Update Statistik
    document.getElementById("totalProduk").textContent = "⭐ Total Produk : " + produkList.length;
    document.getElementById("totalTerjual").textContent = "🔥 Terjual : " + totalTerjualCount;

    // Navigasi Halaman
    const showPage = (id) => {
      document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
      document.getElementById(id).classList.add("active");

      document.querySelectorAll(".menu button").forEach(b => b.classList.remove("nav-active"));
      if (id === "dashboard") {
        document.getElementById("navDashboard").classList.add("nav-active");
      } else {
        document.getElementById("navProduk").classList.add("nav-active");
      }
    };

    document.getElementById("navDashboard").onclick = () => showPage("dashboard");
    document.getElementById("navProduk").onclick = () => showPage("produk");
  </script>
</body>
</html>
